<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Anton';src:url(fonts/node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2) format('woff2')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#EDF0F6;font-family:"DejaVu Sans",sans-serif;position:relative}
.band{position:absolute;inset:0;background:linear-gradient(115deg,#0A1230 0 44%,#7C5CFF 44% 50.5%,#5CE1E6 50.5% 53%,#FFD866 53% 55.5%,transparent 55.5%)}
.glow{position:absolute;left:20px;top:45px;width:540px;height:540px;border-radius:50%;background:radial-gradient(circle,rgba(164,123,255,.45),rgba(164,123,255,0) 68%)}
.logo{position:absolute;left:70px;top:95px;width:440px;height:440px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.logo svg{width:440px;height:440px;display:block}
.txt{position:absolute;left:688px;right:48px;top:122px;color:#0F1B34}
h1{margin:0;font:400 112px/.92 Anton,sans-serif;letter-spacing:2px;text-transform:uppercase}
h1 em{font-style:normal;color:#1E4FD8}
p{margin:22px 0 0;font-size:30px;line-height:1.25;color:#2B3A5C}
.tags{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.tags span{font-weight:700;font-size:22px;padding:10px 16px;border-radius:999px;background:#fff;box-shadow:0 2px 0 rgba(15,27,52,.12)}
.tags span:nth-child(1){background:#1E4FD8;color:#fff}.tags span:nth-child(2){background:#FFD866;color:#241A00}
</style></head><body><div class="band"></div><div class="glow"></div><div class="logo">%LOGO%</div>
<div class="txt"><h1>Got Got<br><em>Need</em></h1><p>Swap Topps Premier League 2026/27 cards with your mates.</p>
<div class="tags"><span>Add your swaps</span><span>Find matches</span><span>Agree swaps</span></div></div></body></html>
