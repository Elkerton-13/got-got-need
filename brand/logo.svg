<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4FD8"/>
      <stop offset="1" stop-color="#0F1B34"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset=".55" stop-color="#E9AE1C"/>
      <stop offset="1" stop-color="#C98F0A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- swap arrows -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M118 150 A170 170 0 0 1 362 96"/>
    <path d="M340 66 L372 100 L330 120"/>
    <path d="M394 362 A170 170 0 0 1 150 416"/>
    <path d="M172 446 L140 412 L182 392"/>
  </g>
  <!-- back card (gold) -->
  <g transform="translate(296 262) rotate(13)" filter="url(#sh)">
    <rect x="-86" y="-120" width="172" height="240" rx="20" fill="url(#gold)" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="0" cy="-6" r="40" fill="#FFFFFF" opacity=".9"/>
    <path d="M-22 -6 L-6 10 L24 -24" fill="none" stroke="#C98F0A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- front card (white with cobalt band) -->
  <g transform="translate(214 258) rotate(-12)" filter="url(#sh)">
    <clipPath id="cc"><rect x="-86" y="-120" width="172" height="240" rx="20"/></clipPath>
    <g clip-path="url(#cc)">
      <rect x="-86" y="-120" width="172" height="240" fill="#F4F6FA"/>
      <path d="M-86 -120 H86 V-36 L-86 18 Z" fill="#1E4FD8"/>
      <path d="M-86 18 L86 -36 V-22 L-86 32 Z" fill="#E9AE1C"/>
    </g>
    <rect x="-86" y="-120" width="172" height="240" rx="20" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <text x="0" y="78" text-anchor="middle" font-family="DejaVu Sans Condensed, DejaVu Sans" font-weight="700" font-size="58" fill="#0F1B34" letter-spacing="1">GGN</text>
    <text x="-60" y="-70" font-family="DejaVu Sans Condensed, DejaVu Sans" font-weight="700" font-size="40" fill="#FFFFFF">32</text>
  </g>
</svg>
